[package]
name = "agentkit-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
e2e = []
samples = ["gpui-kit/profiler"]

[[example]]
name = "components"
required-features = ["samples"]

[dependencies]
base64.workspace = true
agentkit-protocol.workspace = true
serde_json.workspace = true
serde.workspace = true
secrecy.workspace = true
agentkit-store = { workspace = true, features = ["entities"] }
gpui-kit.workspace = true
rust-i18n.workspace = true
similar = "2.7"

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[[example]]
name = "performance"
required-features = ["samples"]

[[example]]
name = "settings"
required-features = ["samples"]

[[example]]
name = "plans"
required-features = ["samples"]

[[example]]
name = "attachments"
required-features = ["samples"]
