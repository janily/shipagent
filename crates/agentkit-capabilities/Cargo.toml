[package]
name = "agentkit-capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
agentkit-protocol.workspace = true
agentkit-client.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
smol.workspace = true
async-channel.workspace = true
opener = { version = "0.8.3", features = ["reveal"] }
rfd = { version = "0.15.4", features = ["common-controls-v6"] }
thiserror.workspace = true
gpui-kit.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4.18.2", features = ["preview-macos-un"] }

[dev-dependencies]
agentkit-sidecar.workspace = true
uuid.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
