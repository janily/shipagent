[package]
name = "agentkit-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
agentkit-protocol.workspace = true
serde_json.workspace = true
smol.workspace = true
async-channel.workspace = true
uuid.workspace = true
secrecy.workspace = true
agentkit-client.workspace = true
agentkit-sidecar.workspace = true
agentkit-store = { workspace = true, features = ["entities"] }
agentkit-ui.workspace = true
agentkit-capabilities.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
url.workspace = true
interprocess = "=2.4.7"
tempfile.workspace = true
thiserror.workspace = true
sha2 = "0.10"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry"] }
rust-i18n.workspace = true

[lints]
workspace = true

[features]
default = []
perf = ["gpui-kit/profiler"]
e2e = ["gpui-kit/profiler", "agentkit-ui/e2e", "agentkit-sidecar/e2e"]

[dev-dependencies]
async-tungstenite.workspace = true
futures.workspace = true
async-net.workspace = true
gpui-kit = {workspace=true,features=["test-support"]}
