name: macOS nightly package
on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/macos-nightly.yml'
      - 'tools/package/**'
      - 'packaging/**'
      - 'xtask/src/package.rs'
  pull_request:
    paths:
      - '.github/workflows/macos-nightly.yml'
      - 'tools/package/**'
      - 'packaging/**'
      - 'xtask/src/package.rs'
      - 'crates/agentkit-sidecar/**'
      - 'crates/agentkit-app/src/controller.rs'
  workflow_dispatch:
    inputs:
      signing:
        description: Engineering artifacts or explicit Developer ID notarization
        type: choice
        options: [engineering, developer-id]
        default: engineering
permissions:
  contents: read
concurrency:
  group: macos-nightly-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/package/*.test.mjs
      - id: select
        run: node tools/package/policy.mjs
        env:
          SHIPAGENT_PACKAGE_MODE: ${{ inputs.signing || 'engineering' }}
          SHIPAGENT_SIGNED_NIGHTLY: ${{ vars.MACOS_SIGNED_NIGHTLY || 'false' }}
  engineering:
    needs: mode
    if: needs.mode.outputs.mode == 'engineering'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: macos-package-engineering-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Build full workbench engineering DMG (ad-hoc, not notarized)
        run: cargo xtask package --target ${{ matrix.target }} --sign ad-hoc --probe
        env:
          AGENTKIT_USE_NPMJS: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify mounted app, bundled backend and real native Agent round
        run: node tools/package/verify-mounted.mjs target/packages/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.target }}-engineering-${{ github.sha }}
          path: |
            target/packages/${{ matrix.target }}/*.dmg
            target/packages/${{ matrix.target }}/*.json
            target/packages/${{ matrix.target }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  developer-id:
    needs: mode
    environment: macos-signing
    # Independent guard: pull-request code cannot select a credential-bearing job.
    if: needs.mode.outputs.mode == 'developer-id' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Only sign commits already on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: macos-package-developer-id-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Import temporary Developer ID and notary credentials (no fallback)
        run: node tools/package/keychain.mjs setup
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
      - name: Build ordinary release, sign, notarize and staple app and DMG
        run: cargo xtask package --target ${{ matrix.target }} --sign developer-id --notarize
        env:
          AGENTKIT_USE_NPMJS: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assess Gatekeeper and verify mounted signed backend
        run: node tools/package/verify-mounted.mjs target/packages/${{ matrix.target }}
      - name: Always restore keychain search list and delete signing material
        if: always()
        run: node tools/package/keychain.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.target }}-developer-id-${{ github.sha }}
          path: |
            target/packages/${{ matrix.target }}/*.dmg
            target/packages/${{ matrix.target }}/*.json
            target/packages/${{ matrix.target }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
