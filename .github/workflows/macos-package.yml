name: macOS package trial
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: node --test tools/package/*.test.mjs
      - name: Build engineering release, sign each Mach-O, measure DMG
        run: cargo xtask package --target macos-arm64 --sign ad-hoc --probe
        env:
          AGENTKIT_USE_NPMJS: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify mounted payload and actual native Agent round
        run: node tools/package/verify-mounted.mjs target/packages/macos-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-engineering-package
          path: |
            target/packages/macos-arm64/*.dmg
            target/packages/macos-arm64/*.json
            target/packages/macos-arm64/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
