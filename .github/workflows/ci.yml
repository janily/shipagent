name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  native-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test -p agentkit-ui -p agentkit-app --features agentkit-app/perf,agentkit-ui/samples --locked
      - run: cargo build -p workbench --locked
      - run: cargo build -p agentkit-ui --features samples --example components --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Open a real native window and render a frame
        if: runner.os != 'Linux'
        run: node tools/native-smoke/run.mjs
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Linux'
        with:
          name: native-smoke-${{ matrix.os }}
          path: target/native-smoke.json
          if-no-files-found: warn

  agent-contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: linux-x64
          - os: macos-14
            backend: darwin-arm64
          - os: windows-2022
            backend: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: node --test tools/fake-llm/server.test.mjs tools/perf/*.test.mjs tools/native-smoke/*.test.mjs
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools/perf -p 'test_*.py'
      - run: cargo xtask backend build
        env:
          AGENTKIT_USE_NPMJS: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo test -p agentkit-sidecar --test agent_turn --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/codegen
      - run: node --test tools/codegen/schema.test.mjs
      - run: cargo xtask codegen --check
