name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p xtask i18n --locked
      - run: cargo xtask i18n --check

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  native-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb xauth xdotool mesa-vulkan-drivers fonts-noto-cjk
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test -p agentkit-ui -p agentkit-app -p agentkit-capabilities --features agentkit-app/perf,agentkit-ui/samples --locked
      - run: cargo build -p workbench --locked
      - run: cargo build -p agentkit-ui --features samples --example components --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Build backend for native capability contracts
        run: cargo xtask backend build --contract
        env:
          AGENTKIT_USE_NPMJS: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - name: Real reverse RPC through native capability handlers
        run: cargo test -p agentkit-capabilities --test rpc_contract --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }}
          AGENTKIT_CONTRACT_SERVER: ${{ github.workspace }}/target/contract/${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }}/transport.js
      - name: Native controller recovers after owned backend replacement
        run: cargo test -p agentkit-app --lib recovery_contract_parent --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }}
      - name: Pending plan compaction and persisted restart dispatch
        run: cargo test -p agentkit-app --lib persisted_plan_compacts_and_resumes_after_backend_restart --locked -- --ignored --nocapture
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }}
      - name: Attachment storage, partial failure, send and restart
        run: cargo test -p agentkit-app --lib real_attachment_storage_send_and_restart --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }}
      - name: Mention file search, Skill provider context, send metadata and restart
        run: cargo test -p agentkit-app --lib real_mentions_search_send_and_restart --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }}
      - name: Draft autosave, attachment hydration, send ownership and cold client restart
        run: cargo test -p agentkit-app --lib draft_contract_parent --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }}
      - name: Native views, search jump, cross-client state and cold plan index
        run: cargo test -p agentkit-app --lib navigation_contract_parent --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }}
      - name: Native settings persist, confirm and restart the owned backend
        run: cargo test -p agentkit-app --lib settings_contract_parent --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }}
      - name: Build full native end-to-end application
        run: cargo build -p workbench --features e2e --locked
      - name: Reject unsafe end-to-end profiles before application startup
        run: node tests/e2e/guard.mjs ${{ runner.os == 'Windows' && 'target/debug/workbench.exe' || 'target/debug/workbench' }}
      - name: Clear only stale end-to-end reports restored by build cache
        run: node -e "require('node:fs').rmSync('target/e2e', {recursive:true,force:true})"
      - name: Native U1 U2 U3 U6 and persisted-profile flows (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          E2E_RUNTIME=$(mktemp -d)
          trap 'rm -rf "$E2E_RUNTIME"' EXIT
          chmod 700 "$E2E_RUNTIME"
          E2E_ICD=$(find /usr/share/vulkan/icd.d -name 'lvp*.json' -print -quit)
          VK_DRIVER_FILES="$E2E_ICD" XDG_RUNTIME_DIR="$E2E_RUNTIME" xvfb-run -a -s '-screen 0 1440x960x24' node tests/e2e/run.mjs target/debug/workbench target/backend/linux-x64 target/e2e/report.json
      - name: Native U1 U2 U3 U6 and persisted-profile flows (macOS Windows)
        if: runner.os != 'Linux'
        run: node tests/e2e/run.mjs ${{ runner.os == 'Windows' && 'target/debug/workbench.exe' || 'target/debug/workbench' }} target/backend/${{ runner.os == 'macOS' && 'darwin-arm64' || 'win32-x64' }} target/e2e/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-e2e-${{ matrix.os }}
          path: target/e2e/report.json
          if-no-files-found: warn
      - name: Open a real native window and render a frame
        if: runner.os != 'Linux'
        run: node tools/native-smoke/run.mjs
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Linux'
        with:
          name: native-smoke-${{ matrix.os }}
          path: target/native-smoke.json
          if-no-files-found: warn

  contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: linux-x64
          - os: macos-15
            backend: darwin-arm64
          - os: windows-2022
            backend: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: node --test tools/fake-llm/server.test.mjs tools/perf/*.test.mjs tools/native-smoke/*.test.mjs tools/fixtures/*.test.mjs tools/package/*.test.mjs tests/e2e/*.test.mjs
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools/perf -p 'test_*.py'
      - run: cargo xtask backend build --contract
        env:
          AGENTKIT_USE_NPMJS: '1'
          AGENTKIT_VALIDATE_UPSTREAM: ${{ runner.os == 'Linux' && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo test -p agentkit-client --test contract --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
          AGENTKIT_CONTRACT_SERVER: ${{ github.workspace }}/target/contract/${{ matrix.backend }}/transport.js
      - run: cargo test -p agentkit-sidecar --test manager --locked -- --ignored --skip owned_supervisor_fixture --skip shell_probe_fixture
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
      - run: cargo test -p agentkit-sidecar --test agent_turn --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
      - run: cargo test -p agentkit-sidecar --test permissions --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
      - run: cargo test -p agentkit-sidecar --test navigation --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
      - run: cargo test -p agentkit-sidecar --test claude_oauth --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
      - run: cargo test -p agentkit-sidecar --test chatgpt_oauth --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
      - run: cargo test -p agentkit-sidecar --test headless_settings --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
      - run: cargo test -p agentkit-sidecar --test settings --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
      - run: cargo test -p agentkit-sidecar --test onboarding --locked -- --ignored
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
      - name: Record and replay all14 real backend fixtures
        run: cargo xtask fixtures record all
        env:
          AGENTKIT_BACKEND_DIR: ${{ github.workspace }}/target/backend/${{ matrix.backend }}
          AGENTKIT_FIXTURE_OUTPUT: ${{ github.workspace }}/target/recorded-fixtures
      - run: cargo xtask fixtures replay target/recorded-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-fixtures-${{ matrix.backend }}
          path: target/recorded-fixtures
          if-no-files-found: warn


  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/codegen
      - run: node --test tools/codegen/*.test.mjs
      - run: node tools/reducer/oracle.mjs --check
      - run: node tools/turns/oracle.mjs --check
      - run: node tools/mentions/oracle.mjs --check
      - run: cargo xtask codegen --check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.21
      - run: cargo llvm-cov -p agentkit-store --tests --json --output-path target/reducer-coverage.json
      - run: node tools/reducer/coverage.mjs target/reducer-coverage.json
      - run: node tools/reducer/coverage.mjs target/reducer-coverage.json turns
      - run: node tools/reducer/coverage.mjs target/reducer-coverage.json session
      - uses: actions/upload-artifact@v4
        with:
          name: reducer-coverage
          path: target/reducer-coverage.json
